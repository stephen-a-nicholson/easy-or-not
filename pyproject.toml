[project]
name = "easy-or-not"
version = "0.1.0"
description = "Are your easy runs actually easy? Time-in-zone and aerobic efficiency from your own Garmin data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Stephen Nicholson" }]
requires-python = ">=3.12"
dependencies = [
    "fitdecode>=0.10",
    "garmin-connect-personal-api-python>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fit-tool>=0.9"]

[project.scripts]
easy-or-not = "easy_or_not.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_or_not"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
